<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
<title id="title">Corporate travel spend intelligence model</title>
<desc id="desc">An illustrative finance view separating actual, committed, estimated, forecast and budget values before policy analysis.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071b25"/><stop offset="1" stop-color="#102b40"/></linearGradient></defs>
<rect width="1400" height="430" rx="26" fill="url(#bg)"/>
<text x="700" y="66" fill="#f2f8fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle">MAKE THE FINANCIAL PICTURE EXPLAINABLE</text>
<text x="700" y="98" fill="#9eb9c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" text-anchor="middle">Keep financial states separate before comparing them</text>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <g>
    <rect x="65" y="148" width="220" height="144" rx="18" fill="#123548" stroke="#438b8b"/>
    <rect x="305" y="148" width="220" height="144" rx="18" fill="#123548" stroke="#438b8b"/>
    <rect x="545" y="148" width="220" height="144" rx="18" fill="#123548" stroke="#438b8b"/>
    <rect x="785" y="148" width="220" height="144" rx="18" fill="#123548" stroke="#438b8b"/>
    <rect x="1025" y="148" width="310" height="144" rx="18" fill="#18344d" stroke="#5b8ab2"/>
  </g>
  <g fill="#5de3bf" font-size="15" font-weight="700" text-anchor="middle">
    <text x="175" y="185">01 · ACTUAL</text><text x="415" y="185">02 · COMMITTED</text>
    <text x="655" y="185">03 · ESTIMATED</text><text x="895" y="185">04 · FORECAST</text>
    <text x="1180" y="185">05 · BUDGET</text>
  </g>
  <g fill="#f2f8fc" font-size="19" font-weight="650" text-anchor="middle">
    <text x="175" y="225">Reconciled spend</text><text x="415" y="225">Confirmed bookings</text>
    <text x="655" y="225">Open trip requests</text><text x="895" y="225">Modelled outlook</text>
    <text x="1180" y="225">Approved allocation</text>
  </g>
  <g fill="#9eb9c9" font-size="13" text-anchor="middle">
    <text x="175" y="256">Finance source</text><text x="415" y="256">Defined commitments</text>
    <text x="655" y="256">Unconfirmed value</text><text x="895" y="256">Horizon + assumptions</text>
    <text x="1180" y="256">Budget source</text>
  </g>
</g>
<path d="M175 315V337H1180V315" fill="none" stroke="#73b8ff" stroke-opacity=".8" stroke-width="2" stroke-dasharray="5 7"/>
<text x="700" y="380" fill="#c6d9e6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" text-anchor="middle">Then analyse variance, forecast accuracy, policy exceptions and data coverage — with definitions and lineage.</text>
</svg>